dataset:
  name: "BRISC2025"
  image_size: 256
  train_dir: "dataset/train"
  val_dir: "dataset/val"
  test_dir: "dataset/test"

model:
  architecture: "PyTorch Hub Brain Segmentation (Fallback)"
  checkpoint: "models/hub_model.pth"
  threshold: 0.5
  in_channels: 1
  out_channels: 1

training:
  epochs: 30
  batch_size: 4
  learning_rate: 0.0001
  patience: 7

device:
  auto: true

debug:
  enabled: true
